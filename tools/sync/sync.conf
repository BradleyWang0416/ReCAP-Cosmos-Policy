# 本地 <-> 远程服务器 同步配置
# 被 pull_mirror.sh / gen_meta.sh 引用。改这里，不要改脚本。

# ssh 别名（见 ~/.ssh/config）
REMOTE_HOST="wxs"

# 远端仓库路径（与本地仓库经由 GitHub 同步的那一个）
REMOTE_REPO="/home/wxs/ReCAP-Cosmos-Policy"

# ---- B 层：镜像层 ----
# 远端产出根目录 -> 本地 .mirror/ 下的子目录名。
# 只拉小文件（见下方 MIRROR_INCLUDE / MIRROR_MAX_SIZE），数据集与权重永不进入。
MIRROR_ROOTS=(
  "/DATA1/wxs/ReCAP_M5B_V05_PILOT:V05_PILOT"
  "/DATA1/wxs/ReCAP_M5B_V04_RUNS:V04_RUNS"
  "/DATA1/wxs/ReCAP_M5B_P2_RUNS:P2_RUNS"
  "/DATA1/wxs/ReCAP_M5B_P2_DIAGNOSTICS:P2_DIAGNOSTICS"
)

# 允许镜像的文件类型（白名单；未列出的一律不传）
MIRROR_INCLUDE=(
  "*.json" "*.jsonl" "*.yaml" "*.yml" "*.toml"
  "*.log" "*.txt" "*.md" "*.csv" "*.tsv"
)

# 保险丝：超过此大小的文件即使类型匹配也不传（防止误拉 ckpt / 巨型 jsonl）
MIRROR_MAX_SIZE="2M"

# 明确排除的目录名（无论层级）
MIRROR_EXCLUDE_DIRS=(
  "checkpoints" "ckpt" "iter_*" "wandb" "tensorboard" "*.egg-info" "__pycache__"
)

# ---- C 层：元信息层（入 git，供离线阅读） ----
META_DIR="元信息"

# 需要生成目录概览的远端大目录
META_TREE_ROOTS=(
  "/DATA1/wxs/DATASETS/Human2Robot"
  "/DATA1/wxs/ReCAP_M5B_V05_PILOT"
  "/DATA1/wxs/ReCAP_M5B_V04_RUNS"
)

# 用于 dump 结构的样本 HDF5（取该数据集任意一条 episode）
META_HDF5_SAMPLE_GLOB="/DATA1/wxs/DATASETS/Human2Robot/data/v1/push_box_common_v1/episode_2.hdf5"

# 远端【宿主机】上用于采集元信息的 Python，需自带 h5py。
# 注意：仓库里的 .venv/bin/python 是指向容器内路径的软链接，宿主机上是断链，
# 只能在 docker 容器里用；采集元信息走 ssh 直连宿主机，故用 anaconda base。
META_PYTHON="/home/wxs/anaconda3/bin/python"
